services:
  9router-gateway:
    build: .
    container_name: 9router-gateway
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=20128
      - DATA_DIR=/data
      - DASHBOARD_PORT=3000
      - DASHBOARD_URL=http://127.0.0.1:3000
      # Set these in production (.env or compose overrides):
      # - INITIAL_PASSWORD=change-me
      # - JWT_SECRET=change-me-to-a-long-random-secret
      # - ANTIGRAVITY_OAUTH_CLIENT_ID=
      # - ANTIGRAVITY_OAUTH_CLIENT_SECRET=
    restart: unless-stopped

volumes:
  9router-data:
