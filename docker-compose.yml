services:
  9router-gateway:
    build: .
    container_name: 9router-gateway
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=20128
      - DATA_DIR=/data
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?set INITIAL_PASSWORD in .env}
      # Optional: Google OAuth client for Go-side Antigravity token refresh.
      # - ANTIGRAVITY_OAUTH_CLIENT_ID=
      # - ANTIGRAVITY_OAUTH_CLIENT_SECRET=
    restart: unless-stopped

volumes:
  9router-data:
